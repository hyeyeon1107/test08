<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Pretendard", "Malgun Gothic", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .login-box {
      background: #fff;
      width: 100%;
      max-width: 380px;
      padding: 40px 32px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .login-box h1 {
      text-align: center;
      font-size: 26px;
      color: #333;
      margin-bottom: 28px;
    }

    .form-group { margin-bottom: 18px; }

    .form-group label {
      display: block;
      font-size: 14px;
      color: #555;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #667eea;
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 22px;
    }

    .options label { color: #555; cursor: pointer; }
    .options a { color: #667eea; text-decoration: none; }
    .options a:hover { text-decoration: underline; }

    .btn-login {
      width: 100%;
      padding: 13px;
      background: #667eea;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-login:hover { background: #5a6fd6; }

    .error {
      color: #e74c3c;
      font-size: 13px;
      margin-bottom: 14px;
      min-height: 18px;
    }

    .signup {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: #777;
    }

    .signup a { color: #667eea; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>로그인</h1>
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="userId">아이디</label>
        <input type="text" id="userId" name="userId" placeholder="아이디를 입력하세요" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password">
      </div>
      <div class="error" id="errorMsg"></div>
      <div class="options">
        <label><input type="checkbox" name="remember"> 로그인 상태 유지</label>
        <a href="#">비밀번호 찾기</a>
      </div>
      <button type="submit" class="btn-login">로그인</button>
    </form>
    <p class="signup">계정이 없으신가요? <a href="#">회원가입</a></p>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const id = document.getElementById("userId").value.trim();
      const pw = document.getElementById("password").value;
      const error = document.getElementById("errorMsg");

      if (!id) {
        error.textContent = "아이디를 입력해주세요.";
        return;
      }
      if (!pw) {
        error.textContent = "비밀번호를 입력해주세요.";
        return;
      }

      error.textContent = "";
      alert(id + "님, 로그인 요청이 전송되었습니다.");
      // TODO: 실제 로그인 API 연동
    });
  </script>
</body>
</html>
